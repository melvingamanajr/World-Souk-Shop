apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: world-souk-retained-gp3
provisioner: ebs.csi.aws.com
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  type: gp3
  encrypted: 'true'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: world-souk-pilot-data
  namespace: wss
spec:
  accessModes: [ReadWriteOncePod]
  storageClassName: world-souk-retained-gp3
  resources:
    requests:
      storage: 10Gi
