name: world-souk-kafka

services:
  broker:
    image: apache/kafka:4.1.2
    ports:
      - '127.0.0.1:19092:19092'
    environment:
      CLUSTER_ID: 'DJN_QwQPRvGitvEStF1IfQ'
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:9092,HOST://0.0.0.0:19092'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://broker:9092,HOST://127.0.0.1:19092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:9093'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
      - broker-data:/var/lib/kafka/data
    healthcheck:
      test: ['CMD', '/opt/kafka/bin/kafka-topics.sh', '--bootstrap-server', 'broker:9092', '--list']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  topic-init:
    image: apache/kafka:4.1.2
    depends_on:
      broker:
        condition: service_healthy
    entrypoint: ['/opt/kafka/bin/kafka-topics.sh']
    command: ['--bootstrap-server', 'broker:9092', '--create', '--if-not-exists', '--topic', 'wss.events.v1', '--partitions', '3', '--replication-factor', '1']

volumes:
  broker-data:
