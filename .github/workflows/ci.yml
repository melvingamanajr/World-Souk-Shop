name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '24.12.0'
          - os: ubuntu-latest
            node: '24.x'
          - os: windows-latest
            node: '24.x'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm test
      - name: Build and check container
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.x'
        run: |
          docker build --tag world-souk:ci .
          container="$(docker run --detach --publish 127.0.0.1:13000:3000 --env WSS_PUBLIC_ORIGIN=https://shop.example.test world-souk:ci)"
          trap 'docker logs "$container"; docker rm --force --volumes "$container" >/dev/null' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:13000/healthz
